<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" font-family="-apple-system, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif">
  <rect width="420" height="560" fill="#fff"/>
  <text x="210" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2430">ベッドを上から見た図</text>
  <text x="210" y="70" text-anchor="middle" font-size="16" fill="#5f6977">頭側</text>
  <text x="210" y="540" text-anchor="middle" font-size="16" fill="#5f6977">足側</text>
  <!-- マットレス -->
  <rect x="110" y="84" width="200" height="430" rx="6" fill="#f6f7f9" stroke="#1c2430" stroke-width="4"/>
  <!-- 枕 -->
  <rect x="160" y="108" width="100" height="56" rx="10" fill="#fff" stroke="#1c2430" stroke-width="3"/>
  <text x="210" y="142" text-anchor="middle" font-size="15" fill="#5f6977">枕</text>
  <!-- 四隅の番号 -->
  <g font-size="28" font-weight="800" text-anchor="middle">
    <circle cx="110" cy="84" r="24" fill="#2f6fb3"/><text x="110" y="93" fill="#fff">1</text>
    <circle cx="110" cy="514" r="24" fill="#2f6fb3"/><text x="110" y="523" fill="#fff">2</text>
    <circle cx="310" cy="514" r="24" fill="#2f6fb3"/><text x="310" y="523" fill="#fff">3</text>
    <circle cx="310" cy="84" r="24" fill="#2f6fb3"/><text x="310" y="93" fill="#fff">4</text>
  </g>
  <!-- 左右 -->
  <text x="54" y="304" text-anchor="middle" font-size="15" fill="#5f6977">ベッドの</text>
  <text x="54" y="324" text-anchor="middle" font-size="15" fill="#5f6977">左側</text>
  <text x="366" y="304" text-anchor="middle" font-size="15" fill="#5f6977">ベッドの</text>
  <text x="366" y="324" text-anchor="middle" font-size="15" fill="#5f6977">右側</text>
</svg>
